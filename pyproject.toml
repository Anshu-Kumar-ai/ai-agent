[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent"
version = "0.1.1"
description = "A general-purpose PC automation AI agent with planning, memory, tool execution, evaluation-driven improvement, and multi-provider LLM routing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "typing_extensions>=4.16.0",
    "anyio>=4.14.2",
    "httpx>=0.28.0",
    "httpcore>=1.0.0",
    "h11>=0.16.0",
    "idna>=3.19",
    "sniffio>=1.3.1",
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
    "groq>=0.5.0",
    "python-dotenv>=1.0.0",
    "rich>=15.0.0",
    "pygments>=2.21.0",
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "psutil>=5.9.0",
    "jsonschema>=4.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "pre-commit>=3.7.0",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "pytest-cov>=5.0.0",
]
local-llm = [
    "ollama>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Anshu-Kumar-ai/AI-Agent"
Repository = "https://github.com/Anshu-Kumar-ai/AI-Agent"
Issues = "https://github.com/Anshu-Kumar-ai/AI-Agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: marks tests as integration tests requiring external services",
    "slow: marks tests as slow running",
    "unit: marks tests as unit tests",
    "desktop: marks tests requiring desktop automation",
    "live_provider: marks tests requiring live LLM provider (may hit rate limits/quota)",
]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PIE", # flake8-pie
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # function calls in default arguments
    "T201",  # print statements in demo/test scripts
    "B011",  # assert False in test helpers
    "B007",  # unused loop control variable in test files
    "I001",  # import block un-sorted in test files
    "F401",  # unused imports in test files
    "F811",  # redefinition of unused in test files
    "F841",  # local variable assigned but never used in test files
    "UP035",  # typing.List deprecated in test files
    "UP006",  # use dict/list instead of Dict/List in test files
    "B904",  # raise from err in test files
    "B905",  # zip without strict in test files
    "F402",  # shadowed import in test files
    "PIE790",  # unnecessary pass in test files
    "B015",  # pointless comparison in app/tools
    "W293",  # blank line contains whitespace in app/tools
    "F541",  # f-string without placeholders in app/tools
    "PIE810",  # call startswith once with tuple in app/tools
    "W291",  # trailing whitespace in app/tools
    "UP022",  # prefer capture_output in app/tools
]
exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
namespace_packages = true
ignore_missing_imports = true
exclude = [".venv", "build", "dist"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101", "B105"]  # assert_used, hardcoded_password

[tool.safety]
ignore = []

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/.venv/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
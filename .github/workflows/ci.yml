name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  # Disable external LLM API calls in CI - use mocks
  MOCK_LLM_PROVIDERS: "true"

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Debug - List files
      run: |
        pwd
        ls -la
        ls -la test_*.py 2>/dev/null || echo "No test_*.py files found in root"
        ls -la app/persistence/test_execution_journal.py 2>/dev/null || echo "No app/persistence/test_execution_journal.py found"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run unit tests (verified release test suites)
      run: |
        python -m pytest test_security_remediation.py test_mm_assurance.py test_change_workflows.py test_repair_workflows.py test_repair_loop.py app/persistence/test_execution_journal.py -v --tb=short --timeout=30
      env:
        MOCK_LLM_PROVIDERS: "true"

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-${{ matrix.python-version }}
        path: .coverage*
        retention-days: 7

  lint:
    name: Linting & Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy

    - name: Run ruff (linting) - app only
      run: |
        ruff check app/ --output-format=github || true

    - name: Run ruff format check - app only
      run: |
        ruff format --check app/ || true

    - name: Run mypy (type checking) - app only
      run: |
        mypy app/ --ignore-missing-imports || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit (SAST)
      run: |
        bandit -r app/ -f json -o bandit-report.json || true

    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json
        retention-days: 30

    - name: Run safety (dependency vulnerabilities)
      run: |
        safety check -r requirements.txt --json -o safety-report.json || true

    - name: Upload safety report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: safety-report
        path: safety-report.json
        retention-days: 30

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, lint]
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Verify package
      run: |
        pip install twine
        twine check dist/*

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-package
        path: dist/*
        retention-days: 7

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, lint, security, build]
    if: always()
    timeout-minutes: 5
    steps:
    - name: Print job statuses
      run: |
        echo "Job statuses:"
        echo "  test: ${{ needs.test.result }}"
        echo "  lint: ${{ needs.lint.result }}"
        echo "  security: ${{ needs.security.result }}"
        echo "  build: ${{ needs.build.result }}"
        if [[ "${{ needs.test.result }}" != "success" ]] || \
           [[ "${{ needs.security.result }}" != "success" ]] || \
           [[ "${{ needs.build.result }}" != "success" ]]; then
          echo "::error::One or more CI jobs failed"
          exit 1
        fi
      env:
        TEST_RESULT: ${{ needs.test.result }}
        LINT_RESULT: ${{ needs.lint.result }}
        SECURITY_RESULT: ${{ needs.security.result }}
        BUILD_RESULT: ${{ needs.build.result }}
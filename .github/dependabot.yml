version: 2
updates:
  # Python dependencies via pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "pip"
    assignees:
      - "anshu-kumar"
    reviewers:
      - "anshu-kumar"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff*"
          - "mypy*"
          - "bandit*"
          - "safety*"
          - "pre-commit*"
        update-types:
          - "minor"
          - "patch"
      llm-providers:
        patterns:
          - "google-generativeai"
          - "openai"
          - "groq"
        update-types:
          - "minor"
          - "patch"
      core-deps:
        patterns:
          - "pydantic"
          - "typing_extensions"
          - "anyio"
          - "httpx"
          - "httpcore"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "anshu-kumar"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
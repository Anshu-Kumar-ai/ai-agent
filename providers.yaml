providers:
  - name: Gemini Flash
    type: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    model_name: gemini-3.7-flash
    enabled: true
    capabilities:
      - reasoning
      - coding
      - tools
    context_window: 32768
    cost_tier: medium

  - name: Groq Fast
    type: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model_name: openai/gpt-oss-20b
    enabled: true
    capabilities:
      - coding
      - reasoning
    context_window: 8192
    cost_tier: low

  - name: OpenRouter Free
    type: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model_name: openrouter/free
    enabled: true
    capabilities:
      - reasoning
      - coding
      - tools
    context_window: 32768
    cost_tier: low

  - name: Local Ollama
    type: local
    base_url: http://localhost:11434
    api_key_env: null
    model_name: llama3
    enabled: true
    capabilities:
      - reasoning
      - coding
    context_window: 8192
    cost_tier: low